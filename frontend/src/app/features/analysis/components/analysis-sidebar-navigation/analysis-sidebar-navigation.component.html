<nav class="flex flex-col gap-3">
  <button
    type="button"
    class="rounded-xl bg-blue-600 px-4 py-3 text-left text-sm font-medium text-white transition hover:bg-blue-500"
    (click)="onNewAnalysis()"
  >
    Nuevo análisis
  </button>
</nav>

<section class="mt-10">
  <p class="mb-3 text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Historial</p>

  @if (historyLoading()) {
    <p class="text-sm text-slate-400">Cargando historial...</p>
  } @else if (historyError()) {
    <p class="text-sm text-red-300">
      {{ historyError() }}
    </p>
  } @else if (!history().length) {
    <p class="text-sm leading-5 text-slate-400">Todavía no hay análisis guardados.</p>
  } @else {
    <div
      class="flex max-h-[420px] flex-col gap-2 overflow-y-auto pr-1"
      [class.max-h-[60vh]]="isMobile()"
    >
      @for (item of history(); track item.id) {
        <button
          type="button"
          class="rounded-xl px-3 py-3 text-left transition hover:bg-white/10"
          [class.bg-white/10]="selectedHistoryItemId() === item.id"
          (click)="onSelectHistory(item)"
        >
          <p class="line-clamp-2 text-sm font-medium text-white">
            {{ item.summary }}
          </p>

          <p class="mt-1 text-xs text-slate-400">
            {{ item.createdAt | date: 'dd/MM/yyyy HH:mm' }}
          </p>
        </button>
      }
    </div>
  }
</section>
